<title>HubOS Fontes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600&family=Syne:wght@500..800&family=Sora:wght@400..800&family=DM+Sans:opsz,wght@9..40,400..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<style>
/* Layout: grade de comparações lado a lado, cada uma uma "home" em miniatura com os raios novos. */
:root{
  --bg:#E6E8EB; --surface:#F3F4F6; --surface-2:#FFFFFF; --ink:#14171B; --ink-2:#555D69; --line:rgba(20,24,30,.10);
  --play:#16884A; --accent:#2F5BE0; --ring:#14171B;
  --r-sm:8px; --r-md:14px; --r-lg:22px; --r-pill:9999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --surface:#191C21; --surface-2:#22262C; --ink:#EDEFF2; --ink-2:#99A1AD; --line:rgba(255,255,255,.08); --play:#2BAA62; --accent:#7C97FF; --ring:#F4F6F8; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1114; --surface:#191C21; --surface-2:#22262C; --ink:#EDEFF2; --ink-2:#99A1AD; --line:rgba(255,255,255,.08); --play:#2BAA62; --accent:#7C97FF; --ring:#F4F6F8; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Inter",system-ui,sans-serif;margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1500px;margin:0 auto;padding-block:28px 48px}
header h1{margin:0 0 6px;font:800 32px "Archivo",sans-serif;font-stretch:115%}
header p{margin:0 0 22px;color:var(--ink-2);max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px}
.opt{background:var(--surface);border-radius:var(--r-lg);padding:22px;display:grid;gap:14px;min-width:0;position:relative}
.opt.rec{box-shadow:inset 0 0 0 2px var(--accent)}
.lab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 12.5px "Inter",sans-serif;color:var(--ink-2)}
.lab b{color:var(--ink);font-size:13.5px}
.badge{font:700 10.5px "Inter",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r-sm);background:var(--accent);color:#fff}
.badge.cur{background:var(--line);color:var(--ink-2)}
.pill{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:var(--r-sm);background:var(--ink);color:var(--bg)}
.title{margin:0;font-size:clamp(34px,3.4vw,50px);line-height:.98;letter-spacing:-.01em;text-wrap:balance;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin:0}
.meta b{color:var(--ink);font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:44px;padding:0 20px;border-radius:var(--r-md);display:inline-flex;align-items:center;gap:8px;font-weight:600;background:var(--surface-2);border:0;color:inherit;font-family:inherit;font-size:15px}
.btn.play{background:var(--play);color:#fff}
.covers{display:flex;gap:10px}
.cv{flex:1;aspect-ratio:2/3;border-radius:var(--r-md);position:relative;overflow:hidden;color:#fff;max-width:100%}
.cv span{position:absolute;left:10px;right:10px;bottom:10px;font-weight:800;font-size:15px;line-height:1.05}
.cv i{position:absolute;top:8px;left:8px;font:700 9.5px "Inter",sans-serif;font-style:normal;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:var(--r-sm);background:rgba(10,12,16,.6)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:2px}
.stat small{color:var(--ink-2);font-size:12px}
.stat b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.body-sample{margin:0;color:var(--ink-2);font-size:14px}
/* combinações */
.c0 .d{font-family:"Archivo",sans-serif;font-stretch:118%} .c0{font-family:"Inter",sans-serif}
.c1 .d{font-family:"Syne",sans-serif} .c1{font-family:"DM Sans",sans-serif}
.c2 .d{font-family:"Syne",sans-serif} .c2{font-family:"Plus Jakarta Sans",sans-serif}
.c3 .d{font-family:"Sora",sans-serif} .c3{font-family:"DM Sans",sans-serif}
.c4 .d{font-family:"Sora",sans-serif} .c4{font-family:"Plus Jakarta Sans",sans-serif}
.cv1{background:linear-gradient(160deg,#1B2735,#3E5A73)} .cv2{background:linear-gradient(160deg,#2B1416,#6E2A2E)} .cv3{background:linear-gradient(160deg,#2E6FD0,#69B7F0)}
</style>

<div class="wrap">
  <header>
    <h1>Qual combinação de fontes?</h1>
    <p>A mesma home em cinco versões. Todas já usam a escala nova de cantos (8 / 14 / 22 / redondo). O título longo de propósito mostra como cada fonte lida com nomes grandes de jogos.</p>
  </header>
  <div class="grid" id="grid"></div>
</div>

<script>
const OPTS = [
  ["c0","Archivo + Inter","atual",""],
  ["c1","Syne + DM Sans","",""],
  ["c2","Syne + Plus Jakarta Sans","",""],
  ["c3","Sora + DM Sans","",""],
  ["c4","Sora + Plus Jakarta Sans","","rec"],
];
document.getElementById("grid").innerHTML = OPTS.map(([c, name, cur, rec], i) => `
  <section class="opt ${c} ${rec}">
    <div class="lab"><b>${i}. ${name}</b>${cur ? '<span class="badge cur">Atual</span>' : ""}${rec ? '<span class="badge">Recomendada</span>' : ""}</div>
    <span class="pill">Steam</span>
    <h2 class="title d">Hollow Knight: Silksong</h2>
    <p class="meta"><span><b>1.284 h</b> jogadas</span><span>Última sessão: <b>Hoje, 01:12</b></span><span>38/42 conquistas</span></p>
    <div class="btns"><button class="btn play">Jogar</button><button class="btn">Detalhes</button><button class="btn">Trocar capa</button></div>
    <div class="covers"><div class="cv cv1"><i>Steam</i><span class="d">Counter-Strike 2</span></div><div class="cv cv2"><i>Steam</i><span class="d">Elden Ring</span></div><div class="cv cv3"><i>Retro</i><span class="d">Super Mario World</span></div></div>
    <div class="stats"><div class="stat"><small>Esta semana</small><b class="d">14 h 18 min</b></div><div class="stat"><small>Sessões</small><b class="d">27</b></div><div class="stat"><small>Conquistas</small><b class="d">348</b></div></div>
    <p class="body-sample">Texto corrido: abriu CS2, aplica o preset CS no AudioHub; fechou, volta ao anterior. 0123456789</p>
  </section>`).join("");
</script>
